<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>PIC architecture</title>
  <desc>Images come from a browser folder upload, the storage inbox, Google Drive or URLs. The FastAPI app serves the JSON API and the web UI and records jobs in PostgreSQL. A worker (pic-worker locally, or Modal) claims jobs, reads images from object storage, computes DINOv2 embeddings, clusters them into L1 groups and L2 clusters, and writes results back to PostgreSQL.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="960" height="620" fill="#ffffff"/>

  <!-- Sources -->
  <text x="30" y="34" font-size="14" font-weight="600" fill="#0f172a">Image sources</text>
  <rect x="30" y="48" width="200" height="42" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="44" y="67" font-size="11.5" fill="#334155">Local folder</text>
  <text x="44" y="82" font-size="10.5" fill="#64748b">browser upload from the web UI</text>
  <rect x="30" y="98" width="200" height="42" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="44" y="117" font-size="11.5" fill="#334155">Image URLs</text>
  <text x="44" y="132" font-size="10.5" fill="#64748b">public http(s) only</text>
  <rect x="30" y="148" width="200" height="42" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="44" y="167" font-size="11.5" fill="#334155">Google Drive folder</text>
  <text x="44" y="182" font-size="10.5" fill="#64748b">optional sync</text>
  <rect x="30" y="198" width="200" height="42" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="44" y="217" font-size="11.5" fill="#334155">Files in the storage inbox</text>
  <text x="44" y="232" font-size="10.5" fill="#64748b">copied there directly</text>

  <!-- API -->
  <rect x="300" y="48" width="300" height="192" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="318" y="74" font-size="14" font-weight="600" fill="#0f172a">FastAPI app</text>
  <text x="318" y="98" font-size="11.5" fill="#334155">JSON API  /api/v1</text>
  <text x="318" y="116" font-size="10.5" fill="#64748b">images · pipeline · clusters · products · search · jobs</text>
  <text x="318" y="142" font-size="11.5" fill="#334155">Web UI  /ui</text>
  <text x="318" y="160" font-size="10.5" fill="#64748b">Runs · Clusters · Products (Jinja2 + htmx)</text>
  <text x="318" y="186" font-size="11.5" fill="#334155">Auth</text>
  <text x="318" y="204" font-size="10.5" fill="#64748b">X-API-Key header · UI session cookie</text>
  <text x="318" y="226" font-size="10.5" fill="#64748b">Creates job rows; never runs ML itself</text>

  <!-- Postgres -->
  <rect x="680" y="48" width="250" height="192" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="698" y="74" font-size="14" font-weight="600" fill="#0f172a">PostgreSQL + pgvector</text>
  <text x="698" y="98" font-size="11.5" fill="#334155">images + DINOv2 embeddings</text>
  <text x="698" y="114" font-size="10.5" fill="#64748b">HNSW index for similarity search</text>
  <text x="698" y="138" font-size="11.5" fill="#334155">L1 groups · L2 clusters</text>
  <text x="698" y="154" font-size="10.5" fill="#64748b">rebuilt on every clustering run</text>
  <text x="698" y="178" font-size="11.5" fill="#334155">products</text>
  <text x="698" y="194" font-size="10.5" fill="#64748b">curated by you; never touched by clustering</text>
  <text x="698" y="218" font-size="11.5" fill="#334155">jobs</text>
  <text x="698" y="232" font-size="10.5" fill="#64748b">queue, progress, results</text>

  <!-- Worker -->
  <rect x="300" y="300" width="630" height="170" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="318" y="326" font-size="14" font-weight="600" fill="#0f172a">Worker</text>
  <text x="380" y="326" font-size="10.5" fill="#64748b">pic-worker (local; CPU, CUDA or Apple MPS)  or  Modal serverless GPU</text>

  <rect x="318" y="344" width="180" height="108" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="332" y="366" font-size="11.5" fill="#334155" font-weight="600">1. Discover</text>
  <text x="332" y="386" font-size="10.5" fill="#64748b">list the inbox</text>
  <text x="332" y="402" font-size="10.5" fill="#64748b">skip exact duplicates</text>
  <text x="332" y="418" font-size="10.5" fill="#64748b">(SHA-256 content hash)</text>

  <rect x="518" y="344" width="190" height="108" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="532" y="366" font-size="11.5" fill="#334155" font-weight="600">2. Ingest</text>
  <text x="532" y="386" font-size="10.5" fill="#64748b">DINOv2 embedding</text>
  <text x="532" y="402" font-size="10.5" fill="#64748b">pHash, dimensions</text>
  <text x="532" y="418" font-size="10.5" fill="#64748b">thumbnail</text>

  <rect x="728" y="344" width="184" height="108" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="742" y="366" font-size="11.5" fill="#334155" font-weight="600">3. Cluster</text>
  <text x="742" y="386" font-size="10.5" fill="#64748b">L1: HDBSCAN on cosine</text>
  <text x="742" y="402" font-size="10.5" fill="#64748b">distance (same product)</text>
  <text x="742" y="418" font-size="10.5" fill="#64748b">L2: UMAP + HDBSCAN on</text>
  <text x="742" y="434" font-size="10.5" fill="#64748b">L1 representatives</text>

  <path d="M498,398 L514,398" stroke="#64748b" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
  <path d="M708,398 L724,398" stroke="#64748b" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>

  <!-- Storage -->
  <rect x="30" y="300" width="230" height="170" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="48" y="326" font-size="14" font-weight="600" fill="#0f172a">Object storage</text>
  <text x="48" y="346" font-size="10.5" fill="#64748b">local disk · S3 · R2 · MinIO · GCS</text>
  <text x="48" y="372" font-size="11.5" fill="#334155">images/</text>
  <text x="120" y="372" font-size="10.5" fill="#64748b">inbox</text>
  <text x="48" y="394" font-size="11.5" fill="#334155">processed/</text>
  <text x="120" y="394" font-size="10.5" fill="#64748b">ingested originals</text>
  <text x="48" y="416" font-size="11.5" fill="#334155">rejected/</text>
  <text x="120" y="416" font-size="10.5" fill="#64748b">duplicates</text>
  <text x="48" y="438" font-size="11.5" fill="#334155">thumbnails/</text>
  <text x="130" y="438" font-size="10.5" fill="#64748b">for the UI</text>

  <!-- Edges -->
  <path d="M230,69 L296,100" stroke="#64748b" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
  <path d="M230,119 L296,130" stroke="#64748b" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
  <path d="M230,169 L296,160" stroke="#64748b" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
  <path d="M230,219 L296,190" stroke="#64748b" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>

  <path d="M600,120 L676,120" stroke="#64748b" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
  <text x="612" y="112" font-size="10.5" fill="#475569">jobs, reads</text>

  <path d="M380,240 L150,296" stroke="#64748b" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
  <text x="200" y="272" font-size="10.5" fill="#475569">uploads to inbox</text>

  <path d="M805,296 L805,244" stroke="#64748b" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
  <path d="M780,244 L780,296" stroke="#64748b" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
  <text x="815" y="276" font-size="10.5" fill="#475569">claim jobs, write results</text>

  <path d="M296,385 L264,385" stroke="#64748b" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
  <path d="M264,405 L296,405" stroke="#64748b" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
  <text x="266" y="376" font-size="10.5" fill="#475569">read</text>
  <text x="266" y="422" font-size="10.5" fill="#475569">move</text>

  <!-- CI -->
  <rect x="30" y="510" width="900" height="80" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="48" y="536" font-size="14" font-weight="600" fill="#0f172a">CI (GitHub Actions)</text>
  <text x="48" y="562" font-size="11.5" fill="#334155">ruff</text>
  <text x="48" y="578" font-size="10.5" fill="#64748b">lint + format</text>
  <text x="178" y="562" font-size="11.5" fill="#334155">mypy</text>
  <text x="178" y="578" font-size="10.5" fill="#64748b">strict type checks</text>
  <text x="328" y="562" font-size="11.5" fill="#334155">pytest unit</text>
  <text x="328" y="578" font-size="10.5" fill="#64748b">70%+ coverage</text>
  <text x="478" y="562" font-size="11.5" fill="#334155">pytest integration</text>
  <text x="478" y="578" font-size="10.5" fill="#64748b">Postgres + pgvector</text>
  <text x="648" y="562" font-size="11.5" fill="#334155">pip-audit</text>
  <text x="648" y="578" font-size="10.5" fill="#64748b">dependency audit</text>
  <text x="778" y="562" font-size="11.5" fill="#334155">Modal deploy</text>
  <text x="778" y="578" font-size="10.5" fill="#64748b">main only, optional</text>
</svg>
