name: CI/CD

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # Keep in sync with the uv version used locally (uv --version).
  UV_VERSION: "0.12.x"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --extra ml
      - run: uv run ruff check src/ tests/ scripts/
      - run: uv run ruff format --check src/ tests/ scripts/
      - run: uv lock --check
      - run: uv run mypy src/pic/
      - run: uv run pip-audit

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --extra ml
      - run: uv run pytest -m unit --cov=src/pic --cov-report=term --cov-fail-under=70

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_DB: pic_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      PIC_DATABASE_URL: postgresql+asyncpg://postgres:test@localhost:5432/pic_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --extra ml
      - name: Create pgvector extension
        run: uv run python -c "import psycopg2; c=psycopg2.connect('postgresql://postgres:test@localhost:5432/pic_test'); c.autocommit=True; c.cursor().execute('CREATE EXTENSION IF NOT EXISTS vector')"
      - run: uv run alembic upgrade head
      - run: uv run pytest -m integration

  deploy-modal:
    if: github.ref == 'refs/heads/main'
    needs: [lint, unit, integration]
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-modal-main
      cancel-in-progress: false
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Deploy to Modal
        if: env.MODAL_TOKEN_ID != ''
        run: |
          uv sync --frozen
          uv run modal deploy src/pic/modal_app.py --tag "${GITHUB_SHA}"
      - name: Skip notice
        if: env.MODAL_TOKEN_ID == ''
        run: echo "::notice::MODAL_TOKEN_ID not set; skipping Modal deploy."

  # Railway auto-deploys the API from GitHub push; no step needed.
